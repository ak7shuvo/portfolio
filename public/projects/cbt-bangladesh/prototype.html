function itinerary(o){
  const days=[];const isDay=o.isDay||!o.end;
  if(!o.start)return '<div class="empty sm">Choose dates to see your day-by-day plan.</div>';
  const n=isDay?0:Math.max(1,diffNights(o.start,o.end));
  for(let i=0;i<=n;i++)days.push({iso:addDays(o.start,i),slots:[]});
  const c=o.c||{};
  if(!isDay&&o.hs)days[0].slots.push(['stay','bed','Arrive and settle in',esc(o.hs.name)+(o.room?' · '+esc(o.room.name):'')+(o.hs.checkIn?' · arrival from '+esc(o.hs.checkIn):'')+' · '+num(n)+' night'+(n>1?'s':''),o.roomTotal]);
  else days[0].slots.push(['arr','pin','Meet your CBT coordinator','Directions are shared before your visit',null]);
  const ei=isDay?0:Math.min(1,days.length-2);
  if(o.exp){const eh=T('hosts',o.exp.hostId)||{};days[ei].slots.push(['exp','star',esc(o.exp.title),'With '+esc(eh.name||'a local community partner')+' · '+num(o.exp.durationHours)+' h · meet at '+esc(o.exp.meetingPoint||'the meeting point'),o.expTotal]);}
  (o.svcs||[]).forEach(s=>days[ei].slots.push(['svc','layers',esc(s.title),esc(s.provider||'Local enterprise'),s.price]));
  if(!isDay)days[days.length-1].slots.push(['dep','out','Depart','Leave a review once you’re home — it helps the community',null]);
  return '<div class="itin">'+days.map((dy,i)=>{const dt=new Date(dy.iso+'T00:00:00');
    return '<div class="day"><div class="dlabel"><b>'+dt.getDate()+'</b>'+dt.toLocaleDateString(LOC(),{month:'short'})+'<br>Day '+(i+1)+'</div><div class="slots">'+
    (dy.slots.length?dy.slots.map(s=>'<div class="slot '+s[0]+'"><div class="sico">'+ic(s[1],16)+'</div><div class="sb"><div class="st">'+s[2]+'</div><div class="sd">'+s[3]+'</div></div>'+(s[4]!=null&&s[4]>0?'<span class="sp">'+fmtBDT(s[4])+'</span>':'')+'</div>').join(''):'<div class="slot"><div class="sico">'+ic('leaf',16)+'</div><div class="sb"><div class="st">Free time in the community</div><div class="sd">Ask your community host about walks, markets and local life</div></div></div>')+'</div></div>';}).join('')+'</div>';
}

/* ─────────────────── MESSAGES ─────────────────── */
function myThreads(){return where('threads',t=>SESSION.role==='tourist'?t.touristId===SESSION.userId:(meHost()&&t.hostId===meHost().id));}
function lastMsg(t){const l=where('messages',m=>m.threadId===t.id);return l.length?l[l.length-1]:{ts:0,text:''};}
function threadName(t){return SESSION.role==='tourist'?(T('hosts',t.hostId)||{}).name||'Community partner':(T('users',t.touristId)||{}).name||'Traveller';}
function messagesView(){
  const qs=(location.hash.split('?')[1]||'');
  const sel=new URLSearchParams(qs).get('th')||SESSION.ui.thread;
  const base=SESSION.role==='host'?'#/host/messages':'#/messages';
  const ths=myThreads().sort((a,b)=>lastMsg(b).ts-lastMsg(a).ts);
  const cur=T('threads',sel)&&ths.some(t=>t.id===sel)?T('threads',sel):ths[0];
  SESSION.ui.thread=cur?cur.id:null;
  const intro=SESSION.role==='tourist'?'Message your community hosts directly — before, during and after your journey.':'Message travellers who have reserved with you.';
  if(!cur){$('#view').innerHTML='<div class="pagehd"><span class="label">Communication</span><h1>Messages</h1><p>'+intro+'</p></div><div class="card empty"><div class="eico">'+ic('chat',24)+'</div><h3>No conversations yet</h3>'+(SESSION.role==='tourist'?'A conversation opens when you send a reservation request.':'Conversations appear when travellers book with you.')+'</div>';return;}
  const msgs=where('messages',m=>m.threadId===cur.id).sort((a,b)=>a.ts-b.ts);
  let changed=false;msgs.filter(m=>m.fromId!==SESSION.userId&&!m.read).forEach(m=>{m.read=true;changed=true;});if(changed){save();renderShell();}
  const other=threadName(cur);const bk=T('bookings',cur.bookingId);const cm=T('communities',cur.communityId)||{};
  $('#view').innerHTML='<div class="pagehd"><span class="label">Communication</span><h1>Messages</h1><p>'+intro+'</p></div>'+
  '<div class="chatwrap"><div class="threads" role="list" aria-label="Conversations">'+ths.map(t=>{const lm=lastMsg(t);
    const un=where('messages',m=>m.threadId===t.id&&m.fromId!==SESSION.userId&&!m.read).length;
    return '<div class="th '+(t.id===cur.id?'on':'')+'" onclick="GO(\''+base+'?th='+t.id+'\')" onkeydown="if(event.key===\'Enter\')GO(\''+base+'?th='+t.id+'\')" tabindex="0" role="listitem"'+(t.id===cur.id?' aria-current="true"':'')+'><div class="nm"><span>'+esc(threadName(t))+'</span>'+(un?'<span class="unr">'+num(un)+'</span>':'<span class="xs mut" style="font-weight:500">'+(lm.ts?dshortTs(lm.ts):'')+'</span>')+'</div><div class="pv">'+esc((lm.text||'').slice(0,60))+'</div></div>';}).join('')+'</div>'+
  '<div class="chatpane"><div class="chathd"><div class="avatar sm">'+initials(other)+'</div><div style="min-width:0;flex:1"><b>'+esc(other)+'</b><div class="xs mut">'+esc(cm.name||'')+(bk?' · '+dshort(bk.start):'')+'</div></div>'+
  (bk?'<span class="tag info code">'+esc(bk.code)+'</span>':'')+'</div>'+
  '<div class="chatlog" id="chatlog" role="log" aria-live="polite">'+msgs.map(m=>{const from=T('users',m.fromId)||{};const mine=m.fromId===SESSION.userId;
    return '<div class="bub '+(mine?'me':'')+(m.id===MESSAGE._last?' new':'')+'">'+(mine?'':'<div class="who">'+esc(from.name||'—')+'</div>')+esc(m.text)+'<div class="ts">'+tstr(m.ts)+'</div></div>';}).join('')+'</div>'+
  '<div class="chatinput"><input id="chat-input" aria-label="Message '+esc(other)+'" placeholder="Write a message…" autocomplete="off" enterkeyhint="send" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();MESSAGE.send(\''+cur.id+'\')}"><button class="btn pri icon" onclick="MESSAGE.send(\''+cur.id+'\')" aria-label="Send message">'+ic('send',18)+'</button></div></div></div>';
  MESSAGE._last=null;
  const log=document.getElementById('chatlog');if(log)log.scrollTop=log.scrollHeight;
}
function dshortTs(ts){const d=new Date(ts);return d.toLocaleDateString(LOC(),{day:'numeric',month:'short'});}

/* ─────────────────── QR VISUAL ─────────────────── */
function qrSVG(code,size){size=size||160;const n=21,c=size/n;
  let seed=hashCode(code);const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  let cells='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const finder=(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
    if(finder)continue;
    if(rnd()<0.44)cells+='<rect x="'+(x*c).toFixed(1)+'" y="'+(y*c).toFixed(1)+'" width="'+c.toFixed(1)+'" height="'+c.toFixed(1)+'"/>';}
  const fp=(x,y)=>'<rect x="'+((x+.5)*c).toFixed(1)+'" y="'+((y+.5)*c).toFixed(1)+'" width="'+(6*c).toFixed(1)+'" height="'+(6*c).toFixed(1)+'" fill="none" stroke="#111" stroke-width="'+c.toFixed(1)+'"/>'+
    '<rect x="'+((x+2)*c).toFixed(1)+'" y="'+((y+2)*c).toFixed(1)+'" width="'+(3*c).toFixed(1)+'" height="'+(3*c).toFixed(1)+'" fill="#111"/>';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" fill="#111" role="img" aria-label="Sample QR pass for '+esc(code)+'">'+cells+fp(0,0)+fp(n-7,0)+fp(0,n-7)+'</svg>';}

/* ─────────────────── ACTIVITY LOG ─────────────────── */
AUDIT.view=function(){
  openModal('Activity log','<p class="ink2" style="margin-top:0">Every important change in this demo is recorded here — '+num(DB.activity.length)+' events so far.</p>'+
  '<div style="max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r-md)">'+(DB.activity.length?DB.activity.map(a=>'<div class="np-item"><span class="tag code" style="margin-right:8px">'+esc(a.event)+'</span><span class="sm">'+esc(a.detail)+'</span><div class="w">'+tstr(a.ts)+'</div></div>').join(''):'<div class="empty sm">No activity yet.</div>')+'</div>',
  '<button class="btn" onclick="closeModal()">Close</button>');
};

/* ─────────────────── DEMO CONTROLS (presenter) ─────────────────── */
const DEMO={
  panel(keep){const p=$('#demo-panel');
    if(!keep&&!p.classList.contains('hide')){DEMO.close();return;}
    const u=me();const P=DB.pricing_rules;
    const b=(onclick,icon,label,cls)=>'<button class="btn sm'+(cls?' '+cls:'')+'" onclick="'+onclick+'">'+(icon?ic(icon,16):'')+'<span>'+label+'</span></button>';
    const g=t=>'<div class="dp-grp label">'+t+'</div>';
    p.innerHTML='<div class="dp-hd"><span>Demo controls</span><button class="btn icon sm ghost" onclick="DEMO.close()" aria-label="Close demo controls">'+ic('x',16)+'</button></div><div class="dp-bd">'+
    '<div class="note">'+ic('user',16)+'<div>'+(SESSION.role?'Viewing as <b>'+ROLE_LABEL[SESSION.role]+'</b> · '+esc(u?u.name:'—'):'Not signed in')+'</div></div>'+
    g('Present')+
    b('MAP.open()','grid','How the system works')+
    b('PRES.toggle();DEMO.close()','play','Start presentation mode')+
    b('AUDIT.view()','list','Activity log ('+num(DB.activity.length)+')')+
    g('Simulation settings')+
    b('DEMO.setPay(\''+(SESSION.payMode==='success'?'fail':'success')+'\')','wallet','Payment outcome: <b>'+(SESSION.payMode==='success'?'Succeeds':'Fails')+'</b>')+
    b('DEMO.setConfirm()','check','Community partner auto-accept: <b>'+(SESSION.autoConfirm?'On':'Off')+'</b>')+
    b('OFF.toggle()','wifiOff','Offline preview: <b>'+(SESSION.offlineSim?'On':'Off')+'</b>')+
    b('DEMO.pricing()','sliders','Benefit-sharing rules ('+num(P.hostFamilyPct)+' / '+num(P.communityFundPct)+' / '+num(P.platformPct)+')')+
    g('Move a journey forward')+
    b('DEMO.checkin()','qr','Check in latest paid reservation')+
    b('DEMO.servicelog()','list','Save service log for latest stay')+
    b('DEMO.impact()','sprout','Complete journey &amp; create impact receipt')+
    b('DEMO.grievance()','flag','Create a sample concern')+
    b('DEMO.advanceCase()','chevR','Advance oldest open concern')+
    g('Data')+
    b('DEMO.reseed()','layers','Reload demo data','dngr')+
    b('DEMO.reset()','x','Reset everything and sign out','dngr')+
    '<div class="xs mut" style="margin-top:6px">Everything runs in this browser. Figures and percentages are demo examples.</div></div>';
    p.classList.remove('hide');$('#demo-fab').setAttribute('aria-expanded','true');},
  close(){$('#demo-panel').classList.add('hide');$('#demo-fab').setAttribute('aria-expanded','false');},
  setPay(m){SESSION.payMode=m;save();DEMO.panel(true);
    toast('Next payments will '+(m==='fail'?'fail (simulated).':'succeed (simulated).'),m==='fail'?'err':'ok');},
  setConfirm(){SESSION.autoConfirm=!SESSION.autoConfirm;save();DEMO.panel(true);},
  latest(sts){const hid=SESSION.role==='host'?(meHost()||{}).id:null;
    const l=where('bookings',b=>hid?b.hostId===hid:b.touristId===SESSION.userId).filter(b=>sts.includes(b.status));
    return l.sort((a,b)=>b.createdAt-a.createdAt)[0]||null;},
  checkin(){const b=DEMO.latest(['PAID']);
    if(!b){toast('There’s no paid reservation to check in.','err');return;}
    BOOKING.checkin(b.code);DEMO.close();},
  servicelog(){const b=DEMO.latest(['CHECKED_IN','IN_PROGRESS']);
    if(!b){toast('No traveller is checked in right now.','err');return;}
    if(!DB.service_logs.some(s=>s.bookingId===b.id))SL.save(b.id);
    else{if(b.status==='CHECKED_IN')BOOKING.setStatus(b,'IN_PROGRESS');save();toast(b.code+' — the service log is already saved.','');}
    DEMO.close();render();},
  impact(){const b=DEMO.latest(['PAID','IN_PROGRESS','CHECKED_IN','COMPLETED']);
    if(!b){toast('No paid reservation found.','err');return;}
    if(b.status!=='COMPLETED'){
      if(!DB.service_logs.some(s=>s.bookingId===b.id))
        DB.service_logs.push({id:uid('sl'),bookingId:b.id,hostId:b.hostId,ts:now(),items:[{name:SL_NAMES[0],qty:diffNights(b.start,b.end)*b.guests,confirmed:true},{name:SL_NAMES[1],qty:2,confirmed:true},{name:SL_NAMES[2],qty:b.guests,confirmed:true}]});
      if(b.status==='PAID')BOOKING.setStatus(b,'CHECKED_IN');
      if(b.status==='CHECKED_IN')BOOKING.setStatus(b,'IN_PROGRESS');
      BOOKING.setStatus(b,'COMPLETED');}
    IMPACT.generate(b.id);DEMO.close();render();},
  grievance(){if(SESSION.role!=='tourist'){toast('Switch to the traveller view first.','err');return;}
    const b=DEMO.latest(['PAID','COMPLETED','CONFIRMED']);
    const no='GRV-'+String(31+DB.grievances.length).padStart(4,'0');
    DB.grievances.push({id:uid('gv'),caseNo:no,touristId:SESSION.userId,bookingId:b?b.id:null,category:'Service issue',
      description:'Sample concern created from demo controls to show the full support process.',
      status:'RECEIVED',ts:now(),timeline:[{s:'RECEIVED',ts:now(),note:'Created from demo controls.'}]});
    AUDIT('grievance.created',no+' · sample');save();
    toast('Sample concern '+no+' created.','ok');DEMO.close();render();},
  advanceCase(){const g=DB.grievances.filter(x=>!['RESOLVED','CLOSED'].includes(x.status)).sort((a,b)=>a.ts-b.ts)[0];
    if(!g){toast('There are no open concerns.','');return;}
    GRIEVANCE.advance(g.id);DEMO.close();},
  pricing(){const P=DB.pricing_rules;openModal('Benefit-sharing rules',
    '<p class="sm ink2" style="margin-top:0">How accommodation income is shared. Community guides and experience hosts are paid their full price directly.</p>'+
    '<div class="grid g3" style="gap:0 14px">'+
    '<div class="field"><label for="pr-h">Community host %</label><input id="pr-h" type="number" min="0" max="100" inputmode="numeric" value="'+P.hostFamilyPct+'"></div>'+
    '<div class="field"><label for="pr-f">Community fund %</label><input id="pr-f" type="number" min="0" max="100" inputmode="numeric" value="'+P.communityFundPct+'"></div>'+
    '<div class="field"><label for="pr-p">Platform operations %</label><input id="pr-p" type="number" min="0" max="100" inputmode="numeric" value="'+P.platformPct+'"></div></div>'+
    '<div class="field"><label for="pr-c">Free cancellation cut-off (hours)</label><div class="hint">Full refund if cancelled at least this long before arrival.</div><input id="pr-c" type="number" min="0" inputmode="numeric" value="'+P.cancellationCutoffHours+'"></div>'+
    '<div class="note">'+ic('info',16)+'<div>The three percentages must add up to 100. '+esc(P.label)+'.</div></div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="DEMO.savePricing()">'+ic('check',16)+' Save rules</button>');},
  savePricing(){const v=k=>+((document.getElementById(k)||{}).value||0);
    const h=v('pr-h'),f=v('pr-f'),p2=v('pr-p'),c=v('pr-c')||48;
    if(h+f+p2!==100||h<0||f<0||p2<0){toast('The three percentages must add up to 100.','err');return;}
    Object.assign(DB.pricing_rules,{hostFamilyPct:h,communityFundPct:f,platformPct:p2,cancellationCutoffHours:c});
    AUDIT('pricing.updated',h+'/'+f+'/'+p2);save();closeModal();
    toast('Benefit-sharing rules updated across the app.','ok');render();},
  reseed(){reseedDemo();DEMO.close();},
  reset(){resetDemo();DEMO.close();}
};
document.addEventListener('pointerdown',e=>{const p=$('#demo-panel');if(p&&!p.classList.contains('hide')&&!p.contains(e.target)&&!$('#demo-fab').contains(e.target)&&!e.target.closest('#modal-root'))DEMO.close();},true);

/* ─────────────────── INITIALISATION ─────────────────── */
window.addEventListener('error',e=>{
  const f=document.getElementById('fatal');
  if(f){f.style.display='block';
    f.innerHTML='<b>Something went wrong:</b> '+esc((e&&e.message)||'Unknown error')+
    '<br><span class="xs">If the data looks wrong, open Demo controls and choose “Reset everything”.</span>';}});
(function init(){
  const step=(name,fn)=>{try{fn();}catch(e){LOG('error','Startup step failed: '+name,e);}};
  step('load data',ensureDB);
  step('offline banner',()=>OFF.apply());
  step('pwa',()=>{
  try{
    const icon='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192"><rect width="192" height="192" rx="44" fill="#0E6B4F"/><circle cx="124" cy="72" r="22" fill="#B8322A"/><path d="M40 132c22-30 44-30 56-12s34 18 56-10v34H40z" fill="#fff" opacity=".92"/></svg>');
    const manifest={name:'CBT Bangladesh — Community-based tourism',short_name:'CBT Bangladesh',lang:'en',start_url:location.href.split('#')[0],display:'standalone',background_color:'#F3F2EC',theme_color:'#0E6B4F',icons:[{src:icon,sizes:'192x192',type:'image/svg+xml',purpose:'any'}]};
    const l=document.createElement('link');l.rel='manifest';
    l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(l);
    const ai=document.createElement('link');ai.rel='apple-touch-icon';ai.href=icon;document.head.appendChild(ai);
    const fi=document.createElement('link');fi.rel='icon';fi.href=icon;document.head.appendChild(fi);
  }catch(e){}
  /* A single-file build has no separate service-worker script, so a real offline cache
     can't be registered. State is persisted in localStorage and the offline banner
     reflects the browser's actual connection status. */
  LOG('info','CBT Bangladesh: running as a single-file PWA. Data is stored locally in this browser.');
});
  step('route',()=>{if(!location.hash)location.hash='#/';});
  step('render',render);
})();

</script>
</body>
</html>
